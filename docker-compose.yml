version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: todo_db
    ports:
      - "3306:3306"

  # Spring Boot Backend
  backend:
    build: ./Backend/todo-summary-assistant
    restart: always
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/todo_db?createDatabaseIfNotExist=true&useSSL=false
      DB_USERNAME: root
      DB_PASSWORD: root

  # React Frontend
  frontend:
    build: ./Frontend/todo
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:8080"

  # Prometheus
  prometheus:
    image: prom/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  # Grafana
  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"
