name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:latest Backend/todo-summary-assistant
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:latest

      - name: Build & Push Frontend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:latest Frontend/todo
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:latest
            docker rm -f todo-backend todo-frontend || true
            docker run -d --name todo-backend -p 8080:8080 ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:latest
            docker run -d --name todo-frontend -p 80:8080 ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:latest
            curl --retry 5 --retry-delay 5 http://localhost:8080/actuator/health
